<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Automated Teller Machine</title>

<link rel="stylesheet" href="atm.css">
</head>
<body>
<div class="atm-container">
    <h2>Automated Teller Machine</h2>
    
    <form action="CheckAmount" method="POST">
        <div class="form-group">
            <label for="user_name">Customer Name</label>
            <input type="text" id="user_name" class="form-control" name="user_name" placeholder="Enter your full name" required>
        </div><br>

        <div class="form-group">
            <label for="user_pin">ATM PIN / Password</label>
            <input type="password" id="user_pin" class="form-control" name="user_pin" placeholder="Enter 4-digit PIN" maxlength="4" required>
        </div><br>

        <div class="form-group">
            <label for="option">Select Transaction Type</label>
            <select id="option" class="form-control" name="option" onchange="handleOptionChange()" required>
                <option value="" disabled selected>-- Select an option --</option>
                <option value="1">Check Balance</option>
                <option value="2">Withdraw Cash</option>
                <option value="3">Deposit Cash</option>
            </select>
        </div><br>

        <div id="withdrawSection" class="dynamic-input form-group">
            <label for="withdrawAmount">Amount to Withdraw ($)</label>
            <input type="number" id="withdrawAmount" class="form-control" name="withdrawAmount" min="1" step="any" placeholder="0.00">
        </div><br>

        <div id="depositSection" class="dynamic-input form-group">
            <label for="depositeAmount">Amount to Deposit ($)</label>
            <input type="number" id="depositeAmount" class="form-control" name="depositeAmount" min="1" step="any" placeholder="0.00">
        </div><br>

        <button type="submit" class="btn btn-primary btn-block">Submit Transaction</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
